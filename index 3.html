<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>Mon Album Panini WC 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #f8fafc; overscroll-behavior-y: none; }
    input, select, button { font-family: inherit; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .slide-up { animation: slideUp 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'panini-wc2026-v3';
    const STICKERS_PER_TEAM = 20;

    const TEAMS = [
      { code: 'SPC', name: 'Spécial', flag: '✨', group: 'special' },
      { code: 'MEX', name: 'Mexique', flag: '🇲🇽', group: 'A' },
      { code: 'KOR', name: 'Corée du Sud', flag: '🇰🇷', group: 'A' },
      { code: 'RSA', name: 'Afrique du Sud', flag: '🇿🇦', group: 'A' },
      { code: 'CZE', name: 'Rép. Tchèque', flag: '🇨🇿', group: 'A' },
      { code: 'CAN', name: 'Canada', flag: '🇨🇦', group: 'B' },
      { code: 'SUI', name: 'Suisse', flag: '🇨🇭', group: 'B' },
      { code: 'QAT', name: 'Qatar', flag: '🇶🇦', group: 'B' },
      { code: 'BIH', name: 'Bosnie-Herz.', flag: '🇧🇦', group: 'B' },
      { code: 'BRA', name: 'Brésil', flag: '🇧🇷', group: 'C' },
      { code: 'MAR', name: 'Maroc', flag: '🇲🇦', group: 'C' },
      { code: 'SCO', name: 'Écosse', flag: '🏴󠁧󠁢󠁳󠁣󠁴󠁿', group: 'C' },
      { code: 'HAI', name: 'Haïti', flag: '🇭🇹', group: 'C' },
      { code: 'USA', name: 'États-Unis', flag: '🇺🇸', group: 'D' },
      { code: 'AUS', name: 'Australie', flag: '🇦🇺', group: 'D' },
      { code: 'PAR', name: 'Paraguay', flag: '🇵🇾', group: 'D' },
      { code: 'TUR', name: 'Turquie', flag: '🇹🇷', group: 'D' },
      { code: 'GER', name: 'Allemagne', flag: '🇩🇪', group: 'E' },
      { code: 'CUW', name: 'Curaçao', flag: '🇨🇼', group: 'E' },
      { code: 'CIV', name: "Côte d'Ivoire", flag: '🇨🇮', group: 'E' },
      { code: 'ECU', name: 'Équateur', flag: '🇪🇨', group: 'E' },
      { code: 'NED', name: 'Pays-Bas', flag: '🇳🇱', group: 'F' },
      { code: 'JPN', name: 'Japon', flag: '🇯🇵', group: 'F' },
      { code: 'SWE', name: 'Suède', flag: '🇸🇪', group: 'F' },
      { code: 'TUN', name: 'Tunisie', flag: '🇹🇳', group: 'F' },
      { code: 'BEL', name: 'Belgique', flag: '🇧🇪', group: 'G' },
      { code: 'EGY', name: 'Égypte', flag: '🇪🇬', group: 'G' },
      { code: 'IRN', name: 'Iran', flag: '🇮🇷', group: 'G' },
      { code: 'NZL', name: 'Nouvelle-Zélande', flag: '🇳🇿', group: 'G' },
      { code: 'ESP', name: 'Espagne', flag: '🇪🇸', group: 'H' },
      { code: 'CPV', name: 'Cap-Vert', flag: '🇨🇻', group: 'H' },
      { code: 'KSA', name: 'Arabie saoudite', flag: '🇸🇦', group: 'H' },
      { code: 'URU', name: 'Uruguay', flag: '🇺🇾', group: 'H' },
      { code: 'FRA', name: 'France', flag: '🇫🇷', group: 'I' },
      { code: 'SEN', name: 'Sénégal', flag: '🇸🇳', group: 'I' },
      { code: 'IRQ', name: 'Irak', flag: '🇮🇶', group: 'I' },
      { code: 'NOR', name: 'Norvège', flag: '🇳🇴', group: 'I' },
      { code: 'ARG', name: 'Argentine', flag: '🇦🇷', group: 'J' },
      { code: 'AUT', name: 'Autriche', flag: '🇦🇹', group: 'J' },
      { code: 'ALG', name: 'Algérie', flag: '🇩🇿', group: 'J' },
      { code: 'JOR', name: 'Jordanie', flag: '🇯🇴', group: 'J' },
      { code: 'POR', name: 'Portugal', flag: '🇵🇹', group: 'K' },
      { code: 'COD', name: 'RD Congo', flag: '🇨🇩', group: 'K' },
      { code: 'COL', name: 'Colombie', flag: '🇨🇴', group: 'K' },
      { code: 'UZB', name: 'Ouzbékistan', flag: '🇺🇿', group: 'K' },
      { code: 'ENG', name: 'Angleterre', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', group: 'L' },
      { code: 'CRO', name: 'Croatie', flag: '🇭🇷', group: 'L' },
      { code: 'GHA', name: 'Ghana', flag: '🇬🇭', group: 'L' },
      { code: 'PAN', name: 'Panama', flag: '🇵🇦', group: 'L' },
    ];

    const TOTAL = TEAMS.length * STICKERS_PER_TEAM;
    const GROUPS_ORDER = ['special', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];

    // SPC = 00 → 19, autres équipes = 1 → 20
    const stickerNums = (code) =>
      code === 'SPC'
        ? Array.from({ length: 20 }, (_, i) => i)
        : Array.from({ length: 20 }, (_, i) => i + 1);
    const isValidNum = (code, n) =>
      code === 'SPC' ? n >= 0 && n <= 19 : n >= 1 && n <= 20;
    const rangeLabel = (code) => (code === 'SPC' ? 'N° (00-19)' : 'N° (1-20)');
    const formatNum = (code, n) => (code === 'SPC' ? String(n).padStart(2, '0') : String(n));

    function PaniniTracker() {
      const [owned, setOwned] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return new Set(JSON.parse(raw));
        } catch (e) {}
        return new Set();
      });
      const [search, setSearch] = useState('');
      const [selectedTeam, setSelectedTeam] = useState(null);
      const [addTeamCode, setAddTeamCode] = useState('SPC');
      const [addNumber, setAddNumber] = useState('');
      const [toast, setToast] = useState('');
      const [showActions, setShowActions] = useState(false);

      const persist = (next) => {
        setOwned(next);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...next]));
        } catch (e) {}
      };

      const toggle = (id) => {
        const next = new Set(owned);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        persist(next);
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 1800);
      };

      const handleAdd = () => {
        const n = parseInt(addNumber);
        if (isNaN(n) || !isValidNum(addTeamCode, n)) {
          showToast(addTeamCode === 'SPC' ? 'Numéro entre 00 et 19' : 'Numéro entre 1 et 20');
          return;
        }
        const id = `${addTeamCode}-${n}`;
        const display = formatNum(addTeamCode, n);
        if (owned.has(id)) {
          showToast(`${addTeamCode} ${display} déjà coché`);
          return;
        }
        const next = new Set(owned);
        next.add(id);
        persist(next);
        showToast(`+ ${addTeamCode} ${display} ajouté`);
        setAddNumber('');
      };

      const teamProgress = (code) => {
        let c = 0;
        for (const i of stickerNums(code)) if (owned.has(`${code}-${i}`)) c++;
        return c;
      };

      const markAllTeam = (code) => {
        const next = new Set(owned);
        for (const i of stickerNums(code)) next.add(`${code}-${i}`);
        persist(next);
        showToast(`${code} complète`);
      };

      const clearTeam = (code) => {
        const next = new Set(owned);
        for (const i of stickerNums(code)) next.delete(`${code}-${i}`);
        persist(next);
        showToast(`${code} vidée`);
      };

      const exportMissing = async () => {
        const lines = [];
        for (const t of TEAMS) {
          const missing = [];
          for (const i of stickerNums(t.code)) {
            if (!owned.has(`${t.code}-${i}`)) missing.push(formatNum(t.code, i));
          }
          if (missing.length) {
            lines.push(`${t.flag} ${t.name} (${t.code}) : ${missing.join(', ')}`);
          }
        }
        const text = `Mes manquantes Panini WC 2026 (${missingCount}/${TOTAL}) :\n\n${lines.join('\n')}`;
        try {
          await navigator.clipboard.writeText(text);
          showToast(`${missingCount} manquantes copiées`);
        } catch {
          showToast('Copie impossible');
        }
      };

      const resetAll = () => {
        if (!confirm('Tout réinitialiser ? Tous les stickers cochés seront perdus.')) return;
        persist(new Set());
        setShowActions(false);
        showToast('Album réinitialisé');
      };

      const ownedCount = owned.size;
      const missingCount = TOTAL - ownedCount;
      const pct = (ownedCount / TOTAL) * 100;
      const finishedTeams = TEAMS.filter((t) => teamProgress(t.code) === 20).length;

      const groupedTeams = useMemo(() => {
        const q = search.toLowerCase().trim();
        const filtered = q
          ? TEAMS.filter(
              (t) => t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q)
            )
          : TEAMS;
        const map = {};
        filtered.forEach((t) => {
          if (!map[t.group]) map[t.group] = [];
          map[t.group].push(t);
        });
        return map;
      }, [search, owned]);

      return (
        <div className="min-h-screen bg-slate-50 pb-16">
          {/* Header */}
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <h1 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
              <span>🏆</span> Mon Album
            </h1>
            <button
              onClick={() => setShowActions(true)}
              className="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-500 active:bg-slate-100"
            >
              ⚙
            </button>
          </div>

          {/* Main stat */}
          <div className="mx-4 mt-2 bg-white rounded-3xl p-5 shadow-sm">
            <div className="text-sm text-slate-500 font-medium">Manquants</div>
            <div className="text-6xl font-extrabold text-slate-900 mt-1 tracking-tight tabular-nums">
              {missingCount}
            </div>
            <div className="mt-4 h-2 bg-slate-100 rounded-full overflow-hidden">
              <div
                className="h-full bg-emerald-500 rounded-full transition-all duration-500"
                style={{ width: `${pct}%` }}
              />
            </div>
            <div className="text-sm text-slate-500 mt-2">
              Vous avez complété <span className="font-bold text-slate-900">{pct.toFixed(0)}%</span> de l'album
            </div>
          </div>

          {/* Two stat cards */}
          <div className="mx-4 mt-3 grid grid-cols-2 gap-3">
            <div className="bg-white rounded-3xl p-4 shadow-sm flex flex-col items-center">
              <div className="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center mb-1.5">
                <span className="text-emerald-500 text-lg">✓</span>
              </div>
              <div className="text-3xl font-extrabold text-slate-900 tabular-nums">{ownedCount}</div>
              <div className="text-xs text-slate-500 mt-0.5 font-medium">Possédés</div>
            </div>
            <div className="bg-white rounded-3xl p-4 shadow-sm flex flex-col items-center">
              <div className="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center mb-1.5">
                <span className="text-amber-500 text-lg">★</span>
              </div>
              <div className="text-3xl font-extrabold text-slate-900 tabular-nums">{finishedTeams}</div>
              <div className="text-xs text-slate-500 mt-0.5 font-medium">Équipes finies</div>
            </div>
          </div>

          {/* Quick add */}
          <div className="mx-4 mt-3 bg-white rounded-3xl p-4 shadow-sm">
            <div className="text-sm text-slate-700 font-semibold mb-2.5">
              Ajouter un sticker <span className="text-slate-400 font-normal">(Ex: MEX 12)</span>
            </div>
            <div className="flex gap-2 items-center">
              <select
                value={addTeamCode}
                onChange={(e) => setAddTeamCode(e.target.value)}
                className="bg-slate-100 px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-900 border-0 outline-none cursor-pointer"
              >
                {TEAMS.map((t) => (
                  <option key={t.code} value={t.code}>{t.code}</option>
                ))}
              </select>
              <input
                type="number"
                min={addTeamCode === 'SPC' ? 0 : 1}
                max={addTeamCode === 'SPC' ? 19 : 20}
                value={addNumber}
                onChange={(e) => setAddNumber(e.target.value)}
                placeholder={rangeLabel(addTeamCode)}
                className="flex-1 min-w-0 px-3 py-2.5 bg-slate-100 rounded-xl text-sm outline-none"
                onKeyDown={(e) => e.key === 'Enter' && handleAdd()}
              />
              <button
                onClick={handleAdd}
                className="bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold active:bg-emerald-600 transition-colors whitespace-nowrap"
              >
                + Ajouter
              </button>
            </div>
          </div>

          {/* Search */}
          <div className="mx-4 mt-4">
            <div className="bg-white rounded-2xl px-3.5 py-2.5 flex items-center gap-2 shadow-sm">
              <span className="text-slate-400">🔍</span>
              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Rechercher un pays..."
                className="flex-1 min-w-0 outline-none text-sm bg-transparent"
              />
              {search && (
                <button onClick={() => setSearch('')} className="text-slate-400 text-sm px-1">×</button>
              )}
            </div>
          </div>

          {/* Team list grouped */}
          <div className="mt-4 px-4 space-y-5">
            {GROUPS_ORDER.map((g) => {
              const teams = groupedTeams[g];
              if (!teams || !teams.length) return null;
              const label = g === 'special' ? 'SECTION SPÉCIALE' : `GROUPE ${g}`;
              return (
                <div key={g}>
                  <div className="text-[11px] font-bold tracking-[0.1em] text-slate-400 mb-2 px-1">
                    {label}
                  </div>
                  <div className="bg-white rounded-3xl shadow-sm overflow-hidden">
                    {teams.map((t, idx) => {
                      const prog = teamProgress(t.code);
                      const pctTeam = (prog / 20) * 100;
                      const done = prog === 20;
                      return (
                        <button
                          key={t.code}
                          onClick={() => setSelectedTeam(t)}
                          className={`w-full px-4 py-3 flex items-center gap-3 text-left active:bg-slate-50 transition-colors ${
                            idx > 0 ? 'border-t border-slate-100' : ''
                          }`}
                        >
                          <div className="text-2xl flex-shrink-0">{t.flag}</div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-baseline gap-2">
                              <div className="font-bold text-slate-900 truncate">{t.name}</div>
                              <div className="text-xs text-slate-400 font-semibold flex-shrink-0">· {t.code}</div>
                            </div>
                            <div className="mt-1.5 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                              <div
                                className={`h-full rounded-full transition-all duration-300 ${
                                  done ? 'bg-amber-400' : 'bg-emerald-500'
                                }`}
                                style={{ width: `${pctTeam}%` }}
                              />
                            </div>
                          </div>
                          <div className="text-right flex-shrink-0" style={{ minWidth: '3rem' }}>
                            <div className={`font-extrabold text-sm tabular-nums ${done ? 'text-amber-500' : 'text-emerald-500'}`}>
                              {pctTeam.toFixed(0)}%
                            </div>
                            <div className="text-[11px] text-slate-400 font-medium tabular-nums">{prog}/20</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}

            {Object.keys(groupedTeams).length === 0 && (
              <div className="text-center py-12 text-slate-400 text-sm">
                Aucune équipe trouvée pour "{search}"
              </div>
            )}
          </div>

          {/* Team detail modal */}
          {selectedTeam && (
            <div
              className="fixed inset-0 z-40 bg-black/40 flex items-end fade-in"
              onClick={() => setSelectedTeam(null)}
            >
              <div
                className="w-full bg-white rounded-t-3xl overflow-hidden flex flex-col slide-up"
                style={{ maxHeight: '85vh' }}
                onClick={(e) => e.stopPropagation()}
              >
                <div className="px-5 pt-3 pb-4 border-b border-slate-100">
                  <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4" />
                  <div className="flex items-center gap-3">
                    <div className="text-4xl">{selectedTeam.flag}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-xl font-extrabold text-slate-900 truncate">{selectedTeam.name}</div>
                      <div className="text-sm text-slate-500 font-medium">
                        {selectedTeam.code} · {teamProgress(selectedTeam.code)}/20 stickers
                      </div>
                    </div>
                    <button
                      onClick={() => setSelectedTeam(null)}
                      className="text-slate-400 text-2xl w-8 h-8 flex items-center justify-center"
                    >×</button>
                  </div>
                </div>

                <div className="overflow-y-auto p-5 flex-1">
                  <div className="grid grid-cols-5 gap-2.5">
                    {stickerNums(selectedTeam.code).map((n) => {
                      const id = `${selectedTeam.code}-${n}`;
                      const has = owned.has(id);
                      return (
                        <button
                          key={n}
                          onClick={() => toggle(id)}
                          className={`aspect-square rounded-2xl font-extrabold text-base flex items-center justify-center transition-all active:scale-90 ${
                            has
                              ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-200'
                              : 'bg-slate-50 text-slate-400 border-2 border-dashed border-slate-200'
                          }`}
                        >
                          {formatNum(selectedTeam.code, n)}
                        </button>
                      );
                    })}
                  </div>

                  <div className="grid grid-cols-2 gap-2 mt-5">
                    <button
                      onClick={() => markAllTeam(selectedTeam.code)}
                      className="py-3 rounded-xl bg-emerald-500 text-white font-bold text-sm active:bg-emerald-600"
                    >✓ Tout cocher</button>
                    <button
                      onClick={() => clearTeam(selectedTeam.code)}
                      className="py-3 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm active:bg-slate-200"
                    >Tout vider</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Actions sheet */}
          {showActions && (
            <div
              className="fixed inset-0 z-40 bg-black/40 flex items-end fade-in"
              onClick={() => setShowActions(false)}
            >
              <div
                className="w-full bg-white rounded-t-3xl p-5 slide-up"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4" />
                <div className="text-lg font-extrabold text-slate-900 mb-4">Actions</div>
                <div className="space-y-2">
                  <button
                    onClick={() => { exportMissing(); setShowActions(false); }}
                    className="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-bold text-sm active:bg-slate-800 flex items-center justify-center gap-2"
                  >
                    📋 Copier la liste des manquantes
                  </button>
                  <button
                    onClick={resetAll}
                    className="w-full py-3.5 rounded-2xl bg-red-50 text-red-600 font-bold text-sm active:bg-red-100"
                  >
                    Tout réinitialiser
                  </button>
                  <button
                    onClick={() => setShowActions(false)}
                    className="w-full py-3.5 rounded-2xl text-slate-500 font-semibold text-sm"
                  >
                    Annuler
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm font-semibold px-4 py-2.5 rounded-full z-50 shadow-xl fade-in">
              {toast}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PaniniTracker />);
  </script>
</body>
</html>
